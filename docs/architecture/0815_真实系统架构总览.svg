<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1480" viewBox="0 0 2400 1480">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071725"/><stop offset=".5" stop-color="#0a2532"/><stop offset="1" stop-color="#102537"/></linearGradient>
  <linearGradient id="header" x1="0" x2="1"><stop stop-color="#0d3046"/><stop offset=".55" stop-color="#14506a"/><stop offset="1" stop-color="#12354e"/></linearGradient>
  <radialGradient id="nucleus"><stop offset="0" stop-color="#f3fff9"/><stop offset=".18" stop-color="#a1f5d7"/><stop offset=".55" stop-color="#22c39a"/><stop offset="1" stop-color="#087566"/></radialGradient>
  <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8fbff"/><stop offset=".45" stop-color="#7fd9eb"/><stop offset="1" stop-color="#2376a6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="aCyan" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#59dfd3"/></marker>
  <marker id="aBlue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#71b6ff"/></marker>
  <marker id="aAmber" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#f0ba68"/></marker>
  <style>
    .sans{font-family:Arial,'Noto Sans SC',sans-serif}.title{font:700 42px Arial,'Noto Sans SC',sans-serif;fill:#f1fbff;letter-spacing:2px}.subtitle{font:400 16px Arial,'Noto Sans SC',sans-serif;fill:#a9c8d8;letter-spacing:1px}.section{font:700 16px Arial,'Noto Sans SC',sans-serif;fill:#8bd8de;letter-spacing:2px}.node{font:700 18px Arial,'Noto Sans SC',sans-serif;fill:#eaf7fb}.body{font:400 15px Arial,'Noto Sans SC',sans-serif;fill:#bfd1d9}.small{font:400 13px Arial,'Noto Sans SC',sans-serif;fill:#a5beca}.code{font:600 13px 'Courier New',monospace;fill:#9be6dc}.core{font:700 25px Arial,'Noto Sans SC',sans-serif;fill:#b9f3ee}.coreSmall{font:600 14px Arial,'Noto Sans SC',sans-serif;fill:#65bdb7}.frame{fill:#0d2636;fill-opacity:.86;stroke:#2b5970;stroke-width:1.5}.module{fill:#123246;fill-opacity:.97;stroke:#3e7088;stroke-width:1.4}.moduleGreen{fill:#123c42;fill-opacity:.98;stroke:#46a998;stroke-width:1.7}.moduleGold{fill:#3e3522;fill-opacity:.92;stroke:#c48b3c;stroke-width:1.4}.modulePink{fill:#3d2639;fill-opacity:.94;stroke:#b76491;stroke-width:1.4}.traceC{fill:none;stroke:#59dfd3;stroke-width:2.6;marker-end:url(#aCyan)}.traceB{fill:none;stroke:#71b6ff;stroke-width:2.4;marker-end:url(#aBlue)}.traceA{fill:none;stroke:#f0ba68;stroke-width:2.4;marker-end:url(#aAmber)}.thin{fill:none;stroke:#3c6477;stroke-width:1.2}.dash{stroke-dasharray:7 6}
  </style>
</defs>
<rect width="2400" height="1480" fill="url(#bg)"/>
<path d="M0 160H2400M0 1320H2400" stroke="#2c5868" stroke-opacity=".55"/>
<!-- header -->
<rect width="2400" height="160" fill="url(#header)"/>
<text x="75" y="65" class="title">云山问学 · 共享认知状态协同系统</text>
<text x="78" y="100" class="subtitle">从原始问题到可追溯结论：一个围绕持续演化研究主体组织的多智能体认知基础设施</text>
<g transform="translate(1790 41)"><rect width="525" height="68" rx="34" fill="#0d2739" stroke="#4e8ca4"/><circle cx="42" cy="34" r="12" fill="#4fe2d3" filter="url(#glow)"/><text x="72" y="29" class="section">SYSTEM PRINCIPLE</text><text x="72" y="49" class="body">共享状态承载连续性 · 专业角色承担行动</text></g>

<!-- Region labels -->
<text x="80" y="215" class="section">01 / COGNITIVE ENTRY</text><text x="80" y="239" class="small">输入、既有资产与外部知识环境</text>
<text x="675" y="215" class="section">02 / STATE NUCLEUS &amp; CONTROL PLANE</text><text x="675" y="239" class="small">研究主体状态、状态转移、意图解释与主控编排</text>
<text x="1815" y="215" class="section">03 / EXPERIENCE &amp; DELIVERY</text><text x="1815" y="239" class="small">会话服务、工作区、MCP 与对用户交付</text>

<!-- left entrance frame -->
<rect x="70" y="275" width="470" height="820" rx="22" class="frame"/>
<text x="110" y="325" class="node">认知入口</text><text x="110" y="350" class="small">不把用户问题压缩为孤立检索查询</text>
<!-- input graphics -->
<g transform="translate(105 392)"><rect width="390" height="112" rx="13" class="module"/><circle cx="42" cy="42" r="21" fill="#216d98"/><path d="M31 42h22M42 31v22" stroke="#c8f1ff" stroke-width="2"/><text x="82" y="37" class="node">原始用户输入</text><text x="82" y="62" class="body">问题、追问、任务边界与反馈</text><text x="82" y="87" class="code">query · constraint · feedback</text></g>
<g transform="translate(105 530)"><rect width="390" height="112" rx="13" class="module"/><circle cx="42" cy="42" r="21" fill="#216d98"/><path d="M29 34h26v18H29zM34 58h16" stroke="#c8f1ff" stroke-width="2" fill="none"/><text x="82" y="37" class="node">资料与多模态输入</text><text x="82" y="62" class="body">PDF、DOCX、PPTX、图像、音频与语音</text><text x="82" y="87" class="code">document · image · audio</text></g>
<g transform="translate(105 668)"><rect width="390" height="112" rx="13" class="moduleGreen"/><circle cx="42" cy="42" r="21" fill="#188671"/><path d="M30 36h24v14H30zM34 53h16" stroke="#d7fff1" stroke-width="2" fill="none"/><text x="82" y="37" class="node">会话内生资产</text><text x="82" y="62" class="body">已有文献、证据、结论、约束与协作记录</text><text x="82" y="87" class="code">assets · evidence · history</text></g>
<g transform="translate(105 806)"><rect width="390" height="145" rx="13" class="moduleGold"/><circle cx="42" cy="42" r="21" fill="#a36c23"/><path d="M30 31h24v22H30zM34 38h16M34 45h12" stroke="#fff4d2" stroke-width="2" fill="none"/><text x="82" y="37" class="node">外部知识与工具环境</text><text x="82" y="62" class="body">本地文档 RAG · 在线论文检索</text><text x="82" y="85" class="body">arXiv / Semantic Scholar / Crossref</text><text x="82" y="112" class="code">MCP tools · resources · web</text></g>
<rect x="105" y="985" width="390" height="66" rx="12" fill="#123e4e" stroke="#3ba8ae"/><text x="130" y="1012" class="node">输入保真边界</text><text x="130" y="1038" class="body">用户原句保持；主体状态承担指代与上下文连续性</text>

<!-- central control frame -->
<rect x="600" y="275" width="1140" height="1035" rx="22" class="frame"/>
<!-- nucleus label -->
<text x="640" y="325" class="node">状态核</text><text x="640" y="350" class="small">系统的基本对象：正在演化的研究主体，而非孤立对话片段</text>
<!-- Nucleus graphic -->
<circle cx="960" cy="535" r="210" fill="#1ce2bd" opacity=".08" filter="url(#glow)"/><circle cx="960" cy="535" r="171" fill="none" stroke="#50d7c6" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="5 8"/>
<circle cx="960" cy="535" r="130" fill="url(#nucleus)" filter="url(#shadow)"/>
<circle cx="960" cy="535" r="108" fill="none" stroke="#dbfff8" stroke-opacity=".55" stroke-width="1.5"/>
<text x="960" y="510" text-anchor="middle" class="core">共享认知状态</text><text x="960" y="538" text-anchor="middle" class="coreSmall">MasterAgentState</text><text x="960" y="566" text-anchor="middle" class="coreSmall">主体 · 证据 · 任务 · 约束</text><text x="960" y="589" text-anchor="middle" class="coreSmall">协作轨迹 · 下一步行动</text>
<!-- internal state orbit chips -->
<g filter="url(#shadow)"><rect x="725" y="387" width="145" height="54" rx="27" fill="#0e3945" stroke="#4bd2be"/><text x="797" y="420" text-anchor="middle" class="body">研究主体</text><rect x="1050" y="387" width="145" height="54" rx="27" fill="#0e3945" stroke="#4bd2be"/><text x="1122" y="420" text-anchor="middle" class="body">证据资产</text><rect x="690" y="628" width="165" height="54" rx="27" fill="#0e3945" stroke="#4bd2be"/><text x="772" y="661" text-anchor="middle" class="body">主体演化</text><rect x="1065" y="628" width="165" height="54" rx="27" fill="#0e3945" stroke="#4bd2be"/><text x="1147" y="661" text-anchor="middle" class="body">协作历史</text></g>
<!-- control plane boxes -->
<g transform="translate(1260 380)"><rect width="415" height="285" rx="18" class="module"/><text x="28" y="40" class="section">CONTROL PLANE</text><text x="28" y="73" class="node">主控编排与行动选择</text><line x1="28" y1="92" x2="387" y2="92" stroke="#3d6d83"/>
<circle cx="50" cy="127" r="10" fill="#72b9ff"/><text x="75" y="133" class="body">IntentRecognitionAgent：解释意图与主体动作</text>
<circle cx="50" cy="167" r="10" fill="#72b9ff"/><text x="75" y="173" class="body">MasterRouter：选择任务、角色与处理路径</text>
<circle cx="50" cy="207" r="10" fill="#f0ba68"/><text x="75" y="213" class="body">资产判别：先复用，必要时再外部探索</text>
<circle cx="50" cy="247" r="10" fill="#c690eb"/><text x="75" y="253" class="body">跨学科解耦：子问题、领域与核心瓶颈</text></g>
<!-- transition module -->
<g transform="translate(665 770)"><rect width="590" height="150" rx="18" class="moduleGreen"/><text x="28" y="39" class="section">STATE TRANSITION PROTOCOL</text><text x="28" y="69" class="node">主体状态转移由 LLM 判断、由确定性规则执行</text><g transform="translate(28 90)"><rect width="112" height="34" rx="17" fill="#1b7569"/><text x="56" y="112" text-anchor="middle" class="code" fill="#e6fff8">INIT</text><rect x="130" width="112" height="34" rx="17" fill="#1b7569"/><text x="186" y="112" text-anchor="middle" class="code" fill="#e6fff8">INHERIT</text><rect x="260" width="112" height="34" rx="17" fill="#1b7569"/><text x="316" y="112" text-anchor="middle" class="code" fill="#e6fff8">APPEND</text><rect x="390" width="112" height="34" rx="17" fill="#1b7569"/><text x="446" y="112" text-anchor="middle" class="code" fill="#e6fff8">REPLACE</text></g></g>
<!-- actual graph connection nodes -->
<path d="M540 448H738" class="traceB"/><path d="M540 585H777" class="traceB"/><path d="M540 723H740" class="traceC"/><path d="M540 880H670V845" class="traceA"/>
<!-- 状态核与协议使用两条平行单向链路：控制下发、结果回写 -->
<path d="M922 665V770" class="traceB"/>
<text x="900" y="735" text-anchor="end" class="code" fill="#71b6ff">读取状态</text>
<path d="M998 770V665" class="traceC"/>
<text x="1020" y="735" class="code" fill="#59dfd3">回写状态</text>
<!-- 状态核向控制面提供当前任务状态 -->
<path d="M1090 505H1260" class="traceB"/>

<!-- agents area -->
<text x="640" y="960" class="section">COOPERATIVE ACTION LAYER</text><text x="640" y="988" class="small">定向读取相关状态 → 完成独立认识行动 → 结果统一回写状态核</text>
<!-- Agents in actual packages -->
<g transform="translate(650 1040)">
<rect width="175" height="145" rx="16" class="moduleGold"/><text x="88" y="34" text-anchor="middle" class="node">理解与推导</text><text x="88" y="62" text-anchor="middle" class="body">ConceptTutor</text><text x="88" y="84" text-anchor="middle" class="body">Derivation</text><text x="88" y="106" text-anchor="middle" class="body">Comparison</text><text x="88" y="130" text-anchor="middle" class="small">概念 · 公式 · 对照</text>
</g>
<g transform="translate(850 1040)"><rect width="175" height="145" rx="16" class="module"/><text x="88" y="34" text-anchor="middle" class="node">检索与考据</text><text x="88" y="62" text-anchor="middle" class="body">DocumentSearch</text><text x="88" y="84" text-anchor="middle" class="body">OnlinePaper</text><text x="88" y="106" text-anchor="middle" class="body">CrossModalRAG</text><text x="88" y="130" text-anchor="middle" class="small">本地 · 在线 · 多模态</text></g>
<g transform="translate(1050 1040)"><rect width="175" height="145" rx="16" class="modulePink"/><text x="88" y="34" text-anchor="middle" class="node">组织与交互</text><text x="88" y="62" text-anchor="middle" class="body">StudyPlanner</text><text x="88" y="84" text-anchor="middle" class="body">Quiz · Summary</text><text x="88" y="106" text-anchor="middle" class="body">GeneralChat</text><text x="88" y="130" text-anchor="middle" class="small">计划 · 组织 · 交流</text></g>
<g transform="translate(1250 1040)"><rect width="175" height="145" rx="16" class="moduleGreen"/><text x="88" y="34" text-anchor="middle" class="node">动态专家</text><text x="88" y="62" text-anchor="middle" class="body">Specialist</text><text x="88" y="84" text-anchor="middle" class="body">{discipline}</text><text x="88" y="106" text-anchor="middle" class="body">SystemControl</text><text x="88" y="130" text-anchor="middle" class="small">跨域任务按需派生</text></g>
<g transform="translate(1450 1040)"><rect width="220" height="145" rx="16" class="modulePink"/><text x="110" y="34" text-anchor="middle" class="node">论证与反思闭环</text><text x="110" y="62" text-anchor="middle" class="body">Evidence Synthesis</text><text x="110" y="84" text-anchor="middle" class="body">Dialectical Inquiry</text><text x="110" y="106" text-anchor="middle" class="body">Reflective Revision</text><text x="110" y="130" text-anchor="middle" class="small">综合 · 质询 · 重构</text></g>
<!-- agent lines -->
<!-- 上方为统一任务分发总线；先沿左侧进入，再横向分发，避开说明文字 -->
<path d="M960 920V940H620V1010H1560" class="traceB"/>
<text x="978" y="935" class="code" fill="#71b6ff">任务分发</text>
<path d="M738 1010V1040M938 1010V1040M1138 1010V1040M1338 1010V1040M1560 1010V1040" class="traceB"/>
<!-- 下方为独立反馈总线，经左侧回写槽返回状态核 -->
<path d="M738 1185V1215H1560M938 1185V1215M1138 1185V1215M1338 1185V1215M1560 1185V1215" class="traceC dash"/>
<text x="1450" y="1207" class="code" fill="#59dfd3">行动结果回写</text>
<path d="M738 1215H630V705H830" class="traceC dash"/>
<text x="642" y="740" class="code" fill="#59dfd3">资产回流</text>

<!-- right service frame -->
<rect x="1800" y="275" width="530" height="820" rx="22" class="frame"/>
<text x="1840" y="325" class="node">会话、服务与交付</text><text x="1840" y="350" class="small">让持续演化的状态进入可用的交互体验</text>
<g transform="translate(1840 392)"><rect width="450" height="106" rx="13" class="module"/><text x="30" y="37" class="node">后端会话服务</text><text x="30" y="63" class="body">FastAPI · WebSocket · Session Manager</text><text x="30" y="87" class="code">streaming · restore · persist</text></g>
<g transform="translate(1840 525)"><rect width="450" height="106" rx="13" class="module"/><text x="30" y="37" class="node">研究工作区</text><text x="30" y="63" class="body">对话、文档、公式、引用与语音交互</text><text x="30" y="87" class="code">frontend · render · voice</text></g>
<g transform="translate(1840 658)"><rect width="450" height="106" rx="13" class="moduleGold"/><text x="30" y="37" class="node">MCP 扩展边界</text><text x="30" y="63" class="body">MCP Server · Tools · Resources</text><text x="30" y="87" class="code">external capability interface</text></g>
<g transform="translate(1840 810)"><rect width="450" height="224" rx="16" fill="#103b51" stroke="#4a9fc8" stroke-width="1.7"/><text x="30" y="39" class="section">COGNITIVE DELIVERY</text><text x="30" y="74" class="node">对用户的可追溯认知交付</text><line x1="30" y1="91" x2="420" y2="91" stroke="#36718d"/><text x="30" y="121" class="body">最终回答与分层解释</text><text x="30" y="149" class="body">证据引用、文献候选与来源追溯</text><text x="30" y="177" class="body">推导、比较、计划与不确定性边界</text><text x="30" y="205" class="body">输出成为下一轮研究主体的可复用资产</text></g>
<path d="M1740 500H1840" class="traceB"/><path d="M1740 745H1770V711H1840" class="traceA"/><path d="M2065 498V525M2065 631V658M2065 764V810" class="traceB"/>

<!-- foundation -->
<rect x="70" y="1350" width="2260" height="82" rx="18" fill="#0b2232" stroke="#2b6077"/>
<text x="105" y="1382" class="section">RUNTIME FOUNDATION</text><text x="105" y="1410" class="body">Python · LangGraph 工作流 · MemorySaver / JSON 会话持久化 · Document RAG · 在线论文检索 · FastAPI · WebSocket · MCP Server · 语音链路</text>
<!-- legend -->
<g transform="translate(1580 1360)"><line x1="0" y1="12" x2="65" y2="12" stroke="#59dfd3" stroke-width="3"/><text x="78" y="17" class="small">状态/资产回写</text><line x1="220" y1="12" x2="285" y2="12" stroke="#71b6ff" stroke-width="3"/><text x="298" y="17" class="small">任务与控制派发</text><line x1="445" y1="12" x2="510" y2="12" stroke="#f0ba68" stroke-width="3"/><text x="523" y="17" class="small">外部知识与工具</text></g>
</svg>